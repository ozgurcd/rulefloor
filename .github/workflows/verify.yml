name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install verification tools
        run: make install-tools
      - name: Confirm Go baseline
        run: go version
      - name: Run complete verification gate
        run: make verify
