name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ozgurcd/lictor/.github/actions/go-toolchain@d35a8ad07dc59bd76153f0ed7d3b1ade22c6cf04
      - name: Install vulnerability checker
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Confirm Go baseline
        run: go version
      - name: Run complete verification gate
        run: make verify
